<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교진 팜 - 도트 농장 시뮬레이션</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrap">
  <div id="hud-top">
    <div class="hud-box" id="hud-day">1일차 (봄)</div>
    <div class="hud-box" id="hud-clock">오전 6:00</div>
    <div class="hud-box" id="hud-money">500G</div>
    <div class="hud-box hud-energy">
      <span>기력</span>
      <div id="energy-bar"><div id="energy-fill"></div></div>
    </div>
    <button class="hud-btn" id="btn-shop">상점 (B)</button>
    <button class="hud-btn" id="btn-save">저장</button>
  </div>

  <canvas id="game" width="960" height="640"></canvas>

  <div id="hud-bottom">
    <div class="tool-slot" data-tool="hoe"><div class="tool-icon">⛏</div><div class="tool-key">1</div><div class="tool-name">호미</div></div>
    <div class="tool-slot" data-tool="water"><div class="tool-icon">🚿</div><div class="tool-key">2</div><div class="tool-name">물뿌리개</div></div>
    <div class="tool-slot" data-tool="seed"><div class="tool-icon">🌱</div><div class="tool-key">3</div><div class="tool-name" id="seed-name">씨앗</div><div class="tool-count" id="seed-count">0</div></div>
    <div class="tool-slot" data-tool="hand"><div class="tool-icon">✋</div><div class="tool-key">4</div><div class="tool-name">수확</div></div>
    <div id="hint">이동 WASD/방향키 · 사용 Space · 씨앗 바꾸기 Tab · 상호작용 E · 상점 B</div>
  </div>

  <div id="message"></div>

  <!-- 상점 모달 -->
  <div id="shop-modal" class="hidden">
    <div id="shop-panel">
      <div id="shop-tabs">
        <button class="shop-tab active" data-tab="buy">씨앗 구매</button>
        <button class="shop-tab" data-tab="sell">작물 판매</button>
        <button id="shop-close">✕</button>
      </div>
      <div id="shop-list"></div>
    </div>
  </div>

  <!-- 취침 모달 -->
  <div id="sleep-modal" class="hidden">
    <div id="sleep-panel">
      <p>잠자리에 들까요? 다음 날 아침이 됩니다.</p>
      <button id="sleep-yes">잔다</button>
      <button id="sleep-no">안 잔다</button>
    </div>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/crops.js"></script>
<script src="js/game.js"></script>
</body>
</html>
